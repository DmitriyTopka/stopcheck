[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["@somnia-chain/reactivity-contracts/=node_modules/@somnia-chain/reactivity-contracts/", "forge-std/=lib/forge-std/src/"]
